<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LFT — Suivi des projets de l'établissement 2025–2026</title>
<link rel="icon" type="image/jpeg" href="logo-lft.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,700;0,800;1,400&display=swap" rel="stylesheet" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/light/style.css" crossorigin="anonymous">
<style>
/* ── Marianne (self-hosted) ── */
@font-face { font-family:'Marianne'; src:url('fonts/Marianne-Light.woff2') format('woff2'); font-weight:300; font-style:normal; font-display:swap; }
@font-face { font-family:'Marianne'; src:url('fonts/Marianne-Regular.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:swap; }
@font-face { font-family:'Marianne'; src:url('fonts/Marianne-Regular_Italic.woff2') format('woff2'); font-weight:400; font-style:italic; font-display:swap; }
@font-face { font-family:'Marianne'; src:url('fonts/Marianne-Medium.woff2') format('woff2'); font-weight:500; font-style:normal; font-display:swap; }
@font-face { font-family:'Marianne'; src:url('fonts/Marianne-Bold.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:swap; }
@font-face { font-family:'Marianne'; src:url('fonts/Marianne-ExtraBold.woff2') format('woff2'); font-weight:800; font-style:normal; font-display:swap; }
/* ═══════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════ */
:root {
  /* AEFE Brand */
  --aefe-blue:     #0053a3;
  --aefe-blue-l:   #1a70c8;
  --aefe-magenta:  #d40883;
  --aefe-mag-l:    #f020a0;

  /* Background — soft warm gradient */
  --bg-deep:   #eef2f7;
  --bg-base:   #f1f5f9;
  --bg-mid:    #ffffff;
  --bg-raise:  #ffffff;

  /* Glass surfaces (Apple liquid glass) */
  --g0: rgba(255,255,255,0.45);
  --g1: rgba(255,255,255,0.55);
  --g2: rgba(255,255,255,0.70);
  --g3: rgba(255,255,255,0.82);

  /* Borders — soft frosted */
  --b0: rgba(255,255,255,0.6);
  --b1: rgba(0,53,163,0.10);
  --b2: rgba(0,53,163,0.18);
  --b-blue: rgba(0,83,163,0.30);
  --b-mag:  rgba(212,8,131,0.20);

  /* Text — strong contrast */
  --t0: #0f172a;
  --t1: #1e293b;
  --t2: #475569;
  --t3: #94a3b8;

  /* Accent glow */
  --glow-blue: 0 0 0 1px rgba(0,83,163,0.15), 0 8px 32px rgba(0,83,163,0.10);
  --glow-mag:  0 0 0 1px rgba(212,8,131,0.15), 0 8px 32px rgba(212,8,131,0.06);

  /* Category tints */
  --cat-lft:  #ea580c;
  --cat-zone: #0891b2;
  --cat-aefe: #7c3aed;
  --cat-inst: #059669;
  --cat-clubs: #db2777;

  /* Status */
  --s-plan: #d97706;
  --s-run:  #2563eb;
  --s-done: #16a34a;

  /* Geometry */
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 24px;
  --r-xl: 32px;

  /* Motion */
  --ease: cubic-bezier(.4,0,.2,1);
  --dur:  300ms;
}

/* ═══════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════ */
*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; font-size:15px; }
body {
  font-family:'Marianne',arial,sans-serif;
  background:#e8edf5;
  color:var(--t0);
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse 90% 60% at 10% -10%, rgba(0,83,163,.15) 0%, transparent 55%),
    radial-gradient(ellipse 70% 50% at 95% 20%, rgba(212,8,131,.08) 0%, transparent 50%),
    radial-gradient(ellipse 60% 50% at 50% 100%, rgba(0,83,163,.10) 0%, transparent 50%);
  background-attachment:fixed;
}
a { color:inherit; text-decoration:none; }
button { font-family:inherit; }
input,select,textarea { font-family:inherit; }

/* ═══════════════════════════════════════
   AMBIENT BACKGROUND
═══════════════════════════════════════ */
.ambient {
  position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
}
.orb {
  position:absolute; border-radius:50%; filter:blur(100px);
  animation:drift 20s ease-in-out infinite alternate;
}
.orb-1 {
  width:600px; height:600px; top:-200px; left:-100px;
  background:radial-gradient(circle, rgba(0,83,163,.12) 0%, transparent 70%);
}
.orb-2 {
  width:500px; height:500px; bottom:-150px; right:-80px;
  background:radial-gradient(circle, rgba(212,8,131,.08) 0%, transparent 70%);
  animation-delay:-10s;
}
.orb-3 {
  width:400px; height:400px; top:35%; left:50%;
  background:radial-gradient(circle, rgba(0,83,163,.06) 0%, transparent 70%);
  animation-delay:-5s;
}
@keyframes drift {
  from { transform:translate(0,0) scale(1); }
  to   { transform:translate(25px,15px) scale(1.04); }
}
.stars { display:none; }

/* ═══════════════════════════════════════
   LAYOUT
═══════════════════════════════════════ */
#app { position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; }
main { flex:1; width:100%; max-width:1280px; margin:0 auto; padding:1.5rem 1.5rem 4rem; }

/* ═══════════════════════════════════════
   GLASS UTILITY
═══════════════════════════════════════ */
.glass {
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 2px 8px rgba(0,30,80,.05), 0 8px 32px rgba(0,53,163,.06),
             inset 0 1px 0 rgba(255,255,255,.7);
}
.glass-strong {
  background:rgba(255,255,255,.7);
  backdrop-filter:blur(30px) saturate(200%);
  -webkit-backdrop-filter:blur(30px) saturate(200%);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 4px 16px rgba(0,30,80,.07), 0 12px 40px rgba(0,53,163,.08),
             inset 0 1px 0 rgba(255,255,255,.8);
}

/* ═══════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════ */
nav {
  position:sticky; top:0; z-index:100;
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,.5);
  box-shadow:0 1px 0 rgba(0,53,163,.06), 0 4px 20px rgba(0,30,80,.06);
}
.nav-inner {
  max-width:1280px; margin:0 auto;
  display:flex; align-items:center; gap:1rem;
  height:80px; padding:0 1.5rem;
}
.nav-brand {
  display:flex; align-items:center; gap:.85rem;
  cursor:pointer; flex-shrink:0;
}
.nav-logo-aefe {
  height:48px; flex-shrink:0;
  padding:4px 8px;
  background:rgba(255,255,255,.85);
  border-radius:var(--r-sm);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 2px 8px rgba(0,30,80,.06);
  display:flex; align-items:center;
}
.nav-logo-aefe img { height:100%; width:auto; object-fit:contain; }
.nav-wordmark { line-height:1.25; }
.nav-wordmark strong {
  display:block; font-family:'Marianne',arial,sans-serif;
  font-weight:700; font-size:1.05rem; color:var(--t0);
  letter-spacing:.01em;
}
.nav-wordmark span {
  font-size:.7rem; color:var(--t2); font-weight:400;
  letter-spacing:.02em;
}
.nav-sep { flex:1; }
.nav-actions { display:flex; align-items:center; gap:.6rem; }

/* User pill */
.user-pill {
  display:none; align-items:center; gap:.55rem;
  background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.7);
  border-radius:999px; padding:.3rem .75rem;
  font-size:.78rem; color:var(--t1);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.user-pill .pill-role {
  background:linear-gradient(135deg,var(--aefe-blue),var(--aefe-magenta));
  color:#fff; font-size:.6rem; font-weight:700;
  padding:.15rem .5rem; border-radius:999px;
  text-transform:uppercase; letter-spacing:.04em;
}

/* Buttons */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  border:none; cursor:pointer; font-weight:600; font-family:'Marianne',arial,sans-serif;
  transition:all var(--dur) var(--ease);
  white-space:nowrap; border-radius:var(--r-md);
  letter-spacing:.01em;
}
.btn-login {
  background:linear-gradient(135deg,var(--aefe-blue) 0%,var(--aefe-magenta) 100%);
  color:#fff; padding:.6rem 1.5rem; font-size:.9rem;
  box-shadow:0 3px 16px rgba(0,83,163,.35);
  border-radius:var(--r-md);
}
.btn-login:hover {
  transform:translateY(-2px);
  box-shadow:0 6px 24px rgba(0,83,163,.5);
}
.btn-ghost {
  background:rgba(255,255,255,.55); color:var(--t1);
  border:1px solid rgba(255,255,255,.6); padding:.55rem 1.3rem; font-size:.85rem;
  backdrop-filter:blur(16px) saturate(180%); -webkit-backdrop-filter:blur(16px) saturate(180%);
  box-shadow:0 2px 8px rgba(0,30,80,.05), inset 0 1px 0 rgba(255,255,255,.7);
}
.btn-ghost:hover { background:rgba(255,255,255,.75); color:var(--t0); transform:translateY(-1px); box-shadow:0 4px 14px rgba(0,30,80,.08); }
.btn-primary {
  background:linear-gradient(135deg,var(--aefe-blue),var(--aefe-magenta));
  color:#fff; padding:.65rem 1.8rem; font-size:.92rem;
  box-shadow:0 3px 18px rgba(0,83,163,.3);
}
.btn-primary:hover {
  transform:translateY(-2px);
  box-shadow:0 6px 28px rgba(0,83,163,.45);
}
.btn-add {
  background:linear-gradient(135deg,var(--aefe-blue),var(--aefe-magenta));
  color:#fff; padding:.6rem 1.5rem; font-size:.88rem;
  box-shadow:0 3px 14px rgba(0,83,163,.3);
}
.btn-add:hover { transform:translateY(-2px); box-shadow:0 6px 24px rgba(0,83,163,.45); }
.btn-back {
  background:rgba(255,255,255,.55); color:var(--t1);
  border:1px solid rgba(255,255,255,.6); padding:.6rem 1.5rem; font-size:.88rem;
  backdrop-filter:blur(16px) saturate(180%); -webkit-backdrop-filter:blur(16px) saturate(180%);
  box-shadow:0 2px 8px rgba(0,30,80,.05), inset 0 1px 0 rgba(255,255,255,.7);
}
.btn-back:hover { background:rgba(255,255,255,.75); color:var(--t0); transform:translateY(-1px); box-shadow:0 4px 14px rgba(0,30,80,.08); }
.btn-danger {
  background:rgba(239,68,68,.06); color:#dc2626;
  border:1px solid rgba(239,68,68,.18); padding:.6rem 1.3rem; font-size:.88rem;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
}
.btn-danger:hover { background:rgba(239,68,68,.14); transform:translateY(-1px); }
.btn-xs { padding:.35rem .8rem; font-size:.78rem; }

/* ═══════════════════════════════════════
   LOCK BADGE
═══════════════════════════════════════ */
.lock-badge {
  display:inline-block; background:rgba(234,179,8,.15); color:#a16207;
  padding:.15rem .5rem; border-radius:6px; font-size:.75rem; font-weight:600;
  border:1px solid rgba(234,179,8,.25);
}

/* ═══════════════════════════════════════
   AUDIT INFO
═══════════════════════════════════════ */
.audit-info { font-size:.82rem; color:var(--t2); }
.audit-info p { margin:0; }

/* ═══════════════════════════════════════
   COMMENTS
═══════════════════════════════════════ */
.comments-section {
  margin-top:1.5rem; padding:1.2rem;
  background:var(--g1); border-radius:var(--r-md);
  border:1px solid var(--b1);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
}
.comments-section h3 { margin-bottom:.8rem; font-size:1rem; }
.comments-list { display:flex; flex-direction:column; gap:.6rem; margin-bottom:1rem; }
.comment-item {
  background:var(--g2); border-radius:var(--r-sm); padding:.7rem .9rem;
  border:1px solid var(--b0);
}
.comment-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:.3rem; font-size:.82rem; }
.comment-date { color:var(--t3); font-size:.75rem; }
.comment-body { font-size:.88rem; line-height:1.5; color:var(--t1); }
.comment-empty { color:var(--t3); font-size:.85rem; font-style:italic; padding:.5rem 0; }
.comment-form { display:flex; gap:.6rem; align-items:flex-end; }
.comment-input {
  flex:1; resize:vertical; min-height:60px; padding:.6rem .8rem;
  border:1px solid var(--b2); border-radius:var(--r-sm); font-family:inherit;
  font-size:.88rem; background:var(--g3);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.comment-input:focus { outline:none; border-color:var(--aefe-blue); box-shadow:0 0 0 3px rgba(0,83,163,.1); }

/* ═══════════════════════════════════════
   TRASH
═══════════════════════════════════════ */
.trash-list { display:flex; flex-direction:column; gap:.6rem; }
.trash-card { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.5rem; }
.trash-info { flex:1; min-width:200px; }
.trash-info strong { display:block; font-size:.92rem; }
.trash-meta { display:block; font-size:.78rem; color:var(--t3); margin-top:.2rem; }
.trash-actions { display:flex; gap:.4rem; flex-wrap:wrap; }
.tile-trash { border-left:3px solid rgba(239,68,68,.4); }

/* ═══════════════════════════════════════
   BREADCRUMB
═══════════════════════════════════════ */
.breadcrumb {
  max-width:1280px; margin:0 auto; padding:.75rem 1.5rem;
  display:flex; align-items:center; gap:.5rem;
  font-size:.88rem; color:var(--t1); font-weight:500;
}
.breadcrumb a,.breadcrumb span[onclick] {
  cursor:pointer; transition:all var(--dur) var(--ease);
  padding:.35rem .7rem; border-radius:var(--r-sm);
  background:rgba(255,255,255,.4);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6);
  color:var(--t1); text-decoration:none;
}
.breadcrumb a:hover,.breadcrumb span[onclick]:hover {
  background:rgba(255,255,255,.7); color:var(--aefe-blue);
  box-shadow:0 2px 8px rgba(0,53,163,.08), inset 0 1px 0 rgba(255,255,255,.7);
}
.breadcrumb .sep { color:var(--t3); font-size:.7rem; }
.breadcrumb .bc-current {
  color:var(--t0); font-weight:600; background:none;
  border:none; box-shadow:none; padding:.35rem .2rem;
}

/* ═══════════════════════════════════════
   HERO
═══════════════════════════════════════ */
.hero {
  position:relative; overflow:hidden;
  border-radius:var(--r-xl); margin-bottom:1.75rem;
  padding:2.5rem 2rem 2rem;
}
.hero::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(0,83,163,.5) 0%,rgba(6,21,37,.6) 50%,rgba(212,8,131,.2) 100%);
  border-radius:inherit;
}
.hero-bg-img {
  position:absolute; inset:0; border-radius:inherit;
  background:
    radial-gradient(ellipse 60% 80% at 0% 50%, rgba(0,83,163,.6) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 100% 100%, rgba(212,8,131,.35) 0%, transparent 60%),
    linear-gradient(160deg, #071b35 0%, #040f1e 100%);
}
.hero-content {
  position:relative; z-index:1;
  display:flex; flex-direction:row; align-items:center;
  gap:2.5rem;
}
.hero-logo {
  width:140px; height:140px; border-radius:50%;
  overflow:hidden; border:3px solid rgba(255,255,255,.25);
  background:var(--aefe-blue); flex-shrink:0;
  box-shadow:0 8px 32px rgba(0,0,0,.3), 0 0 0 6px rgba(255,255,255,.08);
  align-self:center;
}
.hero-logo img { width:100%; height:100%; object-fit:cover; }
.hero-right { flex:1; min-width:0; }
.hero-tagline { margin-bottom:1.2rem; }
.hero-school-name {
  font-family:'Marianne',arial,sans-serif !important;
  font-size:clamp(1rem,2.2vw,1.35rem) !important; font-weight:800 !important;
  color:rgba(255,255,255,.82) !important; letter-spacing:.12em !important;
  margin-bottom:.25rem !important; text-transform:uppercase;
  -webkit-text-fill-color:rgba(255,255,255,.82) !important; background:none !important;
}
.hero-tagline h1 {
  font-family:'Spectral',Georgia,serif;
  font-size:clamp(1.7rem,3.5vw,2.3rem); font-weight:700;
  color:#fff; line-height:1.15; letter-spacing:-.025em;
}
.hero-tagline h1 em {
  font-style:italic; font-weight:400;
  background:linear-gradient(90deg,#fff 30%,rgba(212,8,131,.9));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.hero-tagline p { font-size:.85rem; color:rgba(255,255,255,.78); margin-top:.35rem; font-weight:400; }

/* Hero stats */
.hero-stats {
  display:flex; gap:.75rem; flex-wrap:wrap; justify-content:flex-start;
}
.hstat {
  position:relative;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.14);
  border-radius:var(--r-lg); padding:.9rem 1.4rem;
  cursor:pointer; transition:all var(--dur) var(--ease);
  text-align:center; min-width:100px;
  overflow:hidden;
}
.hstat::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,transparent,rgba(255,255,255,.04));
  border-radius:inherit;
}
.hstat:hover {
  background:rgba(255,255,255,.13);
  transform:translateY(-3px);
  border-color:rgba(255,255,255,.22);
  box-shadow:0 8px 28px rgba(0,0,0,.3);
}
.hstat-num {
  font-family:'Spectral',Georgia,serif;
  font-size:1.9rem; font-weight:700;
  line-height:1; display:block; color:#fff;
}
.hstat-label { font-size:.72rem; color:rgba(255,255,255,.78); font-weight:500; margin-top:.2rem; display:block; }
.hstat.plan .hstat-num { color:#fbbf24; }
.hstat.run  .hstat-num { color:#60a5fa; }
.hstat.done .hstat-num { color:#4ade80; }

/* ═══════════════════════════════════════
   SECTION HEADER
═══════════════════════════════════════ */
.sec-hd {
  display:flex; align-items:center; justify-content:space-between;
  gap:1rem; margin-bottom:1.1rem; flex-wrap:wrap;
}
.sec-title {
  font-family:'Spectral',Georgia,serif;
  font-size:1.15rem; font-weight:700; color:var(--t0);
  display:flex; align-items:center; gap:.5rem;
}
.sec-title span { font-size:.72rem; font-family:'Marianne',arial,sans-serif; font-weight:500; color:var(--t2); margin-left:.2rem; }
.sec-actions { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }

/* ═══════════════════════════════════════
   DASHBOARD GRID
═══════════════════════════════════════ */
/* Ligne 1 : tuile vedette 2/3 + chronologie 1/3 */
.dash-featured {
  display:grid; grid-template-columns:2fr 1fr;
  gap:.9rem; margin-bottom:.9rem;
}
/* Ligne 2 : 4 catégories égales */
.dash-grid-cats {
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:.9rem; margin-bottom:.9rem;
}
/* Ligne 3 : vie scolaire + admin */
.dash-grid-sec {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:.9rem; margin-bottom:.9rem;
}
.dash-tile {
  position:relative; overflow:hidden;
  border-radius:var(--r-lg); cursor:pointer;
  transition:all var(--dur) var(--ease);
  padding:1.5rem 1.4rem;
  display:flex; flex-direction:column; gap:.45rem;
  min-height:160px; justify-content:flex-start;
}
/* Tuile vedette plus haute */
.tile-featured { min-height:200px !important; padding:2rem 1.8rem; }
/* Description courte sous le titre */
.tile-desc {
  font-size:.76rem; color:var(--t2); margin:.05rem 0 0;
  font-family:'Marianne',arial,sans-serif; line-height:1.45;
  position:relative; z-index:2;
}
.tile-accent .tile-desc { color:rgba(255,255,255,.85); }
/* Badges multiples dans une tuile */
.tile-chips { display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.35rem; position:relative; z-index:2; }
/* Tuile discrète */
.tile-muted { opacity:.45; transition:opacity var(--dur) var(--ease); }
.tile-muted:hover { opacity:1; }
/* Barre compacte horizontale */
.tile-help {
  min-height:52px !important; padding:.9rem 1.4rem;
  flex-direction:row; align-items:center; gap:.75rem;
}
.tile-help .tile-icon { font-size:1rem; margin:0; }
.tile-help .tile-name { font-size:.82rem; }
.dash-help-bar { margin-top:.9rem; }
.dash-tile::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.4) 0%,transparent 60%);
  border-radius:inherit; pointer-events:none;
}
/* Glass tiles */
.tile-glass {
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 2px 8px rgba(0,30,80,.04), 0 8px 32px rgba(0,53,163,.06),
             inset 0 1px 0 rgba(255,255,255,.7);
}
.tile-glass:hover {
  background:rgba(255,255,255,.7);
  border-color:rgba(0,83,163,.2);
  transform:translateY(-4px);
  box-shadow:0 4px 16px rgba(0,30,80,.07), 0 16px 48px rgba(0,53,163,.10),
             inset 0 1px 0 rgba(255,255,255,.8);
}
/* Accent tile (center) */
.tile-accent {
  background:linear-gradient(135deg,var(--aefe-blue) 0%,#003d82 40%,rgba(212,8,131,.6) 100%);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 4px 24px rgba(0,83,163,.35);
}
.tile-accent:hover {
  transform:translateY(-4px);
  box-shadow:0 12px 40px rgba(0,83,163,.5), 0 0 0 1px rgba(255,255,255,.2);
}

.tile-icon { font-size:1.3rem; line-height:1; margin-bottom:.2rem; position:relative; z-index:2; color:var(--aefe-blue); }
.tile-icon i { vertical-align:middle; }
.tile-accent .tile-icon { color:rgba(255,255,255,.9); }
.dash-tile .tile-watermark {
  position:absolute;
  right:12px; top:50%; transform:translateY(-50%);
  font-size:5rem; line-height:1;
  opacity:.06;
  pointer-events:none;
  z-index:0;
  color:var(--aefe-blue);
  user-select:none;
  transition:opacity var(--dur) var(--ease), color var(--dur) var(--ease);
}
.dash-tile .tile-watermark i { font-size:inherit; }
.dash-tile:hover .tile-watermark { opacity:.12; }
.tile-accent .tile-watermark { opacity:.12; color:rgba(255,255,255,.95); }
.tile-accent:hover .tile-watermark { opacity:.2; }
.tile-help .tile-watermark { display:none; }
.tile-name {
  font-family:'Spectral',Georgia,serif;
  font-size:1rem; font-weight:700; color:var(--t0); line-height:1.25;
  position:relative; z-index:2;
}
.tile-accent .tile-name { color:#fff; }
.tile-chip {
  display:inline-flex; align-items:center;
  font-size:.7rem; font-weight:600; padding:.2rem .6rem;
  border-radius:999px; color:#fff; align-self:flex-start;
  border:1px solid rgba(255,255,255,.2);
  position:relative; z-index:2;
}
.tc-lft  { background:rgba(234,88,12,.1); color:var(--cat-lft); border-color:rgba(234,88,12,.2); }
.tc-zone { background:rgba(8,145,178,.1); color:var(--cat-zone); border-color:rgba(8,145,178,.2); }
.tc-aefe { background:rgba(124,58,237,.08); color:var(--cat-aefe); border-color:rgba(124,58,237,.18); }
.tc-inst  { background:rgba(5,150,105,.08); color:var(--cat-inst); border-color:rgba(5,150,105,.18); }
.tc-clubs { background:rgba(219,39,119,.08); color:var(--cat-clubs); border-color:rgba(219,39,119,.18); }
.tc-white { background:rgba(255,255,255,.12); color:rgba(255,255,255,.85); border-color:rgba(255,255,255,.2); }
.tc-muted { background:var(--g1); color:var(--t2); border-color:var(--b1); }

/* ═══════════════════════════════════════
   FILTERS BAR
═══════════════════════════════════════ */
.filters {
  display:flex; gap:.5rem; flex-wrap:wrap; align-items:center;
  margin-bottom:1.1rem;
}
.f-btn {
  background:rgba(255,255,255,.45); border:1px solid rgba(255,255,255,.5);
  color:var(--t2); border-radius:999px; padding:.32rem .85rem;
  font-size:.77rem; font-weight:500; cursor:pointer;
  transition:all var(--dur) var(--ease);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
}
.f-btn:hover { background:rgba(255,255,255,.65); color:var(--t0); }
.f-btn.on { background:rgba(0,83,163,.12); border-color:rgba(0,83,163,.3); color:var(--aefe-blue); }
.f-search {
  background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.6);
  color:var(--t0); border-radius:999px; padding:.32rem 1rem;
  font-size:.82rem; outline:none; min-width:210px;
  transition:all var(--dur) var(--ease);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.f-search::placeholder { color:var(--t3); }
.f-search:focus { border-color:rgba(0,83,163,.25); background:rgba(255,255,255,.7); box-shadow:0 0 0 4px rgba(0,83,163,.08); }

/* ═══════════════════════════════════════
   PROJECT CARDS
═══════════════════════════════════════ */
.proj-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.9rem;
}
.pcard {
  border-radius:var(--r-lg); overflow:hidden; cursor:pointer;
  display:flex; flex-direction:column;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 2px 8px rgba(0,30,80,.04), 0 8px 28px rgba(0,53,163,.05),
             inset 0 1px 0 rgba(255,255,255,.7);
  transition:all var(--dur) var(--ease);
}
.pcard:hover {
  background:rgba(255,255,255,.72);
  border-color:rgba(0,83,163,.18);
  transform:translateY(-5px);
  box-shadow:0 6px 20px rgba(0,30,80,.07), 0 16px 48px rgba(0,53,163,.10),
             inset 0 1px 0 rgba(255,255,255,.8);
}
.pcard-top {
  padding:.65rem .85rem;
  display:flex; align-items:center; justify-content:space-between; gap:.4rem;
  border-bottom:1px solid var(--b0);
}
.cat-badge {
  font-size:.65rem; font-weight:700; padding:.18rem .55rem;
  border-radius:999px; text-transform:uppercase; letter-spacing:.04em;
  color:#fff;
}
.cb-lft  { background:rgba(234,88,12,.1); color:var(--cat-lft); }
.cb-zone { background:rgba(8,145,178,.1); color:var(--cat-zone); }
.cb-aefe { background:rgba(124,58,237,.08); color:var(--cat-aefe); }
.cb-inst  { background:rgba(5,150,105,.08); color:var(--cat-inst); }
.cb-clubs { background:rgba(219,39,119,.08); color:var(--cat-clubs); }
.cb-def   { background:var(--g1); color:var(--t1); }

.status-pill {
  font-size:.65rem; font-weight:600; padding:.18rem .55rem;
  border-radius:999px; border:1px solid; letter-spacing:.03em;
}
.sp-plan { color:var(--s-plan); border-color:rgba(217,119,6,.25); background:rgba(217,119,6,.07); }
.sp-run  { color:var(--s-run);  border-color:rgba(37,99,235,.25);  background:rgba(37,99,235,.07); }
.sp-done { color:var(--s-done); border-color:rgba(22,163,74,.25);  background:rgba(22,163,74,.07); }

.pcard-body { padding:.8rem .85rem; flex:1; }
.pcard-id { font-size:.62rem; color:var(--t3); font-weight:600; letter-spacing:.05em; margin-bottom:.2rem; }
.pcard-title {
  font-family:'Spectral',Georgia,serif;
  font-size:.92rem; font-weight:700; color:var(--t0);
  line-height:1.3; margin-bottom:.35rem;
}
.pcard-desc {
  font-size:.76rem; color:var(--t2); line-height:1.55;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.pcard-foot {
  padding:.5rem .85rem;
  border-top:1px solid var(--b0);
  display:flex; align-items:center; justify-content:space-between; gap:.5rem;
}
.pcard-teacher { font-size:.7rem; color:var(--t2); display:flex; align-items:center; gap:.28rem; }
.pcard-prio {
  font-size:.65rem; font-weight:600; padding:.15rem .45rem; border-radius:999px;
}
.pp-haute   { background:rgba(239,68,68,.08); color:#dc2626; }
.pp-moyenne { background:rgba(217,119,6,.08); color:#d97706; }
.pp-basse   { background:rgba(22,163,74,.08); color:#16a34a; }

/* Empty */
.empty {
  grid-column:1/-1; text-align:center; padding:3.5rem 1rem;
  color:var(--t3);
}
.empty-icon { font-size:2.5rem; margin-bottom:.75rem; display:block; }

/* ═══════════════════════════════════════
   PROJECT DETAIL
═══════════════════════════════════════ */
.detail-wrap { max-width:900px; margin:0 auto; }
.detail-banner {
  border-radius:var(--r-xl); padding:2.2rem 2.5rem;
  margin-bottom:1.4rem; position:relative; overflow:hidden;
}
.detail-banner-bg {
  position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(0,50,120,.96) 0%,rgba(4,15,30,.97) 50%,rgba(150,5,90,.55) 100%);
}
.detail-banner > *:not(.detail-banner-bg) { position:relative; z-index:1; }
.detail-id {
  font-size:.88rem; color:rgba(255,255,255,.9); font-weight:700; margin-bottom:.6rem;
  letter-spacing:.06em; text-transform:uppercase;
}
.detail-title {
  font-family:'Spectral',Georgia,serif;
  font-size:clamp(1.6rem,3.8vw,2.2rem); font-weight:700; color:#fff;
  margin-bottom:1.1rem; line-height:1.25;
  text-shadow:0 1px 3px rgba(0,0,0,.2);
}
.detail-meta { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
.dmeta-chip {
  font-size:.88rem; font-weight:600; padding:.45rem 1.1rem;
  border-radius:var(--r-sm); background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.35); color:#fff;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  letter-spacing:.01em; text-shadow:0 1px 3px rgba(0,0,0,.3);
}

.detail-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:.9rem; margin-bottom:1.2rem;
}
.dblock {
  border-radius:var(--r-lg); padding:1.1rem 1.2rem;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 2px 8px rgba(0,30,80,.04), inset 0 1px 0 rgba(255,255,255,.7);
}
.dblock.full { grid-column:1/-1; }
.dblock h3 {
  font-family:'Spectral',Georgia,serif;
  font-size:.88rem; font-weight:700; color:var(--t0);
  margin-bottom:.6rem; display:flex; align-items:center; gap:.4rem;
}
.dblock p,.dblock ul { font-size:.83rem; color:var(--t1); line-height:1.65; }
.dblock ul { padding-left:1rem; }
.dlabel {
  font-size:.68rem; font-weight:600; color:var(--t3);
  text-transform:uppercase; letter-spacing:.07em; margin-bottom:.2rem; margin-top:.65rem;
}
.dlabel:first-child { margin-top:0; }

.axe-glass {
  border-radius:var(--r-md); padding:1rem 1.1rem;
  background:rgba(0,83,163,.1);
  border:1px solid rgba(0,83,163,.25);
}
.axe-num { font-size:.68rem; font-weight:700; color:var(--aefe-blue); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.2rem; }
.axe-ttl { font-family:'Spectral',Georgia,serif; font-size:.9rem; font-weight:700; color:var(--t0); margin-bottom:.5rem; }
.axe-chips { display:flex; flex-wrap:wrap; gap:.4rem; }
.axe-chip {
  font-size:.68rem; font-weight:600; padding:.18rem .55rem;
  border-radius:999px; background:rgba(0,83,163,.12);
  border:1px solid rgba(0,83,163,.3); color:var(--aefe-blue);
}

.detail-actions { display:flex; gap:.75rem; margin-top:1.5rem; flex-wrap:wrap; }

/* ═══════════════════════════════════════
   TIMELINE
═══════════════════════════════════════ */
.timeline { position:relative; padding-left:2.2rem; }
.timeline::before {
  content:''; position:absolute; left:.7rem; top:.5rem; bottom:.5rem; width:2px;
  background:linear-gradient(to bottom, var(--aefe-blue), var(--aefe-magenta), transparent);
  border-radius:2px;
}
.tl-month { margin-bottom:2rem; }
.tl-month-hd {
  font-family:'Spectral',Georgia,serif;
  font-size:.9rem; font-weight:700; color:var(--t0);
  margin-bottom:.75rem; display:inline-flex; align-items:center; gap:.4rem;
  background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.6);
  padding:.35rem .85rem; border-radius:999px;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.tl-item {
  border-radius:var(--r-md); padding:.7rem .9rem;
  margin-bottom:.5rem; cursor:pointer;
  background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.6);
  border-left:3px solid var(--b1);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  box-shadow:0 1px 4px rgba(0,30,80,.04), inset 0 1px 0 rgba(255,255,255,.6);
  transition:all var(--dur) var(--ease); position:relative;
}
.tl-item::before {
  content:''; position:absolute;
  left:-1.9rem; top:50%; transform:translate(-50%,-50%);
  width:10px; height:10px; border-radius:50%;
  background:var(--aefe-blue); border:2px solid var(--bg-base);
}
.tl-item:hover { background:rgba(255,255,255,.7); transform:translateX(3px); }
.tl-item.phase-lancement   { border-left-color:var(--s-run); }
.tl-item.phase-realisation { border-left-color:var(--s-plan); }
.tl-item.phase-cloture     { border-left-color:var(--s-done); }
.tl-top { display:flex; align-items:center; gap:.55rem; margin-bottom:.15rem; }
.tl-phase {
  font-size:.62rem; font-weight:700; padding:.14rem .48rem;
  border-radius:999px; color:#fff; letter-spacing:.03em;
}
.phase-lancement   .tl-phase { background:rgba(96,165,250,.4);  color:var(--s-run); border:1px solid rgba(96,165,250,.3); }
.phase-realisation .tl-phase { background:rgba(251,191,36,.25); color:var(--s-plan); border:1px solid rgba(251,191,36,.3); }
.phase-cloture     .tl-phase { background:rgba(74,222,128,.2);  color:var(--s-done); border:1px solid rgba(74,222,128,.3); }
.tl-name { font-size:.82rem; font-weight:600; color:var(--t0); }
.tl-sub  { font-size:.72rem; color:var(--t2); }

/* ═══════════════════════════════════════
   INFO PAGES (etab, clubs, etc.)
═══════════════════════════════════════ */
.info-card {
  border-radius:var(--r-lg); padding:1.4rem 1.5rem; margin-bottom:1rem;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 2px 8px rgba(0,30,80,.04), inset 0 1px 0 rgba(255,255,255,.7);
}
.info-card h2 {
  font-family:'Spectral',Georgia,serif;
  font-size:1.05rem; font-weight:700; color:var(--t0);
  margin-bottom:.75rem; padding-bottom:.6rem;
  border-bottom:1px solid var(--b1);
}
.info-card h3 {
  font-family:'Spectral',Georgia,serif;
  font-size:.88rem; font-weight:700; color:var(--t0);
  margin:.9rem 0 .4rem;
}
.info-card p { font-size:.85rem; color:var(--t1); line-height:1.7; margin-bottom:.4rem; }
.info-card ul { font-size:.83rem; color:var(--t1); padding-left:1.1rem; line-height:1.8; }

/* ═══════════════════════════════════════
   ADMIN PANEL
═══════════════════════════════════════ */
.admin-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.admin-card {
  border-radius:var(--r-lg); padding:1.2rem 1.3rem;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 2px 8px rgba(0,30,80,.04), inset 0 1px 0 rgba(255,255,255,.7);
}
.admin-card.full { grid-column:1/-1; }
.admin-card-hd {
  font-family:'Spectral',Georgia,serif;
  font-size:.9rem; font-weight:700; color:var(--t0);
  margin-bottom:.85rem; display:flex; align-items:center; justify-content:space-between;
}
.admin-card-hd small { font-size:.72rem; font-family:'Marianne',arial,sans-serif; font-weight:400; color:var(--t3); }

.row-item {
  display:flex; align-items:center; justify-content:space-between;
  padding:.48rem .6rem; border-radius:var(--r-sm); margin-bottom:.35rem;
  background:var(--g0); border:1px solid var(--b0);
  transition:background var(--dur) var(--ease);
}
.row-item:hover { background:rgba(255,255,255,.5); }
.row-info {}
.row-name { font-size:.82rem; font-weight:600; color:var(--t0); }
.row-sub  { font-size:.7rem; color:var(--t3); margin-top:.05rem; }
.role-tag {
  font-size:.6rem; font-weight:700; padding:.13rem .45rem;
  border-radius:999px; text-transform:uppercase; letter-spacing:.04em;
  margin-right:.35rem;
}
.rt-admin    { background:rgba(239,68,68,.1); color:#dc2626; }
.rt-dir      { background:rgba(22,163,74,.1); color:#16a34a; }
.rt-vs       { background:rgba(217,119,6,.1); color:#d97706; }
.rt-teacher  { background:rgba(0,83,163,.1); color:var(--aefe-blue); }
.nav-role-badge { font-size:.6rem; font-weight:700; padding:.13rem .45rem; border-radius:999px; text-transform:uppercase; letter-spacing:.04em; }

.btn-xs {
  font-size:.7rem; padding:.22rem .6rem; border-radius:999px;
  border:none; cursor:pointer; font-weight:600;
  transition:all var(--dur) var(--ease);
}
.bx-del { background:rgba(239,68,68,.08); color:#dc2626; }
.bx-del:hover { background:rgba(239,68,68,.15); }
.bx-add { background:rgba(0,83,163,.1); color:var(--aefe-blue); }
.bx-add:hover { background:rgba(0,83,163,.18); }

.admin-input-row { display:flex; gap:.5rem; margin-top:.75rem; }
.admin-input {
  flex:1; background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.6);
  color:var(--t0); border-radius:999px; padding:.38rem .9rem;
  font-size:.8rem; outline:none;
}
.admin-input::placeholder { color:var(--t3); }
.admin-input:focus { border-color:rgba(0,83,163,.2); box-shadow:0 0 0 4px rgba(0,83,163,.08); background:rgba(255,255,255,.7); }

/* ═══════════════════════════════════════
   MODALS
═══════════════════════════════════════ */
.overlay {
  position:fixed; inset:0; z-index:200;
  background:rgba(0,20,50,.3);
  backdrop-filter:blur(12px) saturate(150%); -webkit-backdrop-filter:blur(12px) saturate(150%);
  display:none; align-items:center; justify-content:center; padding:1rem;
}
.overlay.open { display:flex; }

.modal {
  width:100%; max-width:520px; max-height:90vh; overflow-y:auto;
  border-radius:var(--r-xl);
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(30px) saturate(200%);
  -webkit-backdrop-filter:blur(30px) saturate(200%);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 8px 32px rgba(0,30,80,.1), 0 32px 64px rgba(0,53,163,.08),
             inset 0 1px 0 rgba(255,255,255,.8);
  padding:2rem; position:relative;
}
.modal.modal-lg { max-width:660px; }
.modal h2 {
  font-family:'Spectral',Georgia,serif;
  font-size:1.2rem; font-weight:700; color:var(--t0); margin-bottom:1.2rem;
}
.modal-close {
  position:absolute; top:1.1rem; right:1.1rem;
  background:var(--g1); border:1px solid var(--b1);
  color:var(--t2); width:30px; height:30px; border-radius:50%;
  cursor:pointer; font-size:.85rem;
  display:flex; align-items:center; justify-content:center;
  transition:all var(--dur) var(--ease);
}
.modal-close:hover { background:var(--g2); color:var(--t0); }
.modal h2 { color:var(--t0); }

/* Form elements */
.fg { margin-bottom:.85rem; }
.fg label {
  display:block; font-size:.75rem; font-weight:600;
  color:var(--t2); margin-bottom:.3rem; letter-spacing:.02em;
}
.fg input,.fg select,.fg textarea {
  width:100%; background:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.7);
  color:var(--t0); border-radius:var(--r-md); padding:.52rem .85rem;
  font-size:.85rem; outline:none;
  transition:all var(--dur) var(--ease);
}
.fg select option { background:#fff; color:var(--t0); }
.fg input:focus,.fg select:focus,.fg textarea:focus {
  border-color:rgba(0,83,163,.25);
  background:rgba(255,255,255,.8);
  box-shadow:0 0 0 4px rgba(0,83,163,.08);
}
.fg textarea { resize:vertical; min-height:74px; }
.fg-hint { font-size:.7rem; color:var(--t3); margin-top:.28rem; }
.fg-pw { position:relative; }
.fg-pw input { padding-right:2.6rem; }
.pw-eye {
  position:absolute; right:.55rem; top:50%; transform:translateY(-50%);
  background:none; border:none; cursor:pointer; padding:.25rem;
  line-height:0; opacity:.3; transition:opacity var(--dur) var(--ease);
}
.pw-eye:hover { opacity:.55; }
.pw-eye svg { width:18px; height:18px; stroke:#64748b; stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round; }

/* Multi-select niveaux dropdown */
.niv-wrap { position:relative; }
.niv-btn {
  width:100%; background:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.7);
  color:var(--t0); border-radius:var(--r-md); padding:.52rem .85rem;
  font-size:.85rem; outline:none; cursor:pointer; text-align:left;
  transition:all var(--dur) var(--ease);
  display:flex; align-items:center; justify-content:space-between; gap:.5rem;
  min-height:38px;
}
.niv-btn:focus, .niv-btn.open {
  border-color:rgba(0,83,163,.25);
  background:rgba(255,255,255,.8);
  box-shadow:0 0 0 4px rgba(0,83,163,.08);
}
.niv-btn .niv-arrow { font-size:.6rem; color:var(--t3); transition:transform .2s; flex-shrink:0; }
.niv-btn.open .niv-arrow { transform:rotate(180deg); }
.niv-btn-text { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.niv-btn-text.placeholder { color:var(--t3); }
.niv-drop {
  display:none; position:absolute; top:calc(100% + 4px); left:0; right:0;
  background:rgba(255,255,255,.92); backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.7); border-radius:var(--r-md);
  box-shadow:0 8px 24px rgba(0,30,80,.12); z-index:100;
  max-height:280px; overflow-y:auto; padding:.35rem 0;
}
.niv-drop.show { display:block; }
.niv-group-label {
  font-size:.65rem; font-weight:700; color:var(--t3);
  text-transform:uppercase; letter-spacing:.06em;
  padding:.45rem .85rem .2rem; user-select:none;
}
.niv-opt {
  display:flex; align-items:center; gap:.5rem;
  padding:.32rem .85rem; cursor:pointer; font-size:.82rem; color:var(--t0);
  transition:background .15s;
}
.niv-opt:hover { background:rgba(0,83,163,.06); }
.niv-opt input[type="checkbox"] {
  accent-color:var(--aefe-blue); width:15px; height:15px;
  cursor:pointer; flex-shrink:0;
}
.niv-opt.all-opt { border-bottom:1px solid rgba(0,0,0,.06); padding-bottom:.45rem; margin-bottom:.2rem; font-weight:600; }
.niv-tags { display:flex; flex-wrap:wrap; gap:.25rem; margin-top:.35rem; }
.niv-tag {
  font-size:.68rem; background:rgba(0,83,163,.08); color:var(--aefe-blue);
  padding:.15rem .45rem; border-radius:20px; font-weight:500;
}
.fg-row { display:grid; grid-template-columns:1fr 1fr; gap:.65rem; }

.msg-err {
  background:rgba(239,68,68,.06); border:1px solid rgba(239,68,68,.2);
  color:#dc2626; border-radius:var(--r-md); padding:.5rem .8rem;
  font-size:.78rem; margin-bottom:.75rem; display:none;
}
.msg-ok {
  background:rgba(22,163,74,.06); border:1px solid rgba(22,163,74,.2);
  color:#16a34a; border-radius:var(--r-md); padding:.5rem .8rem;
  font-size:.78rem; margin-bottom:.75rem; display:none;
}
.msg-info {
  background:rgba(37,99,235,.06); border:1px solid rgba(37,99,235,.18);
  color:#2563eb; border-radius:var(--r-md); padding:.5rem .8rem;
  font-size:.78rem; margin-bottom:.75rem;
}
.modal-links { display:flex; justify-content:space-between; margin-top:.8rem; flex-wrap:wrap; gap:.5rem; }
.modal-link { font-size:.78rem; color:var(--s-run); cursor:pointer; }
.modal-link:hover { text-decoration:underline; }

/* ═══════════════════════════════════════
   LOADER
═══════════════════════════════════════ */
.loader {
  display:flex; align-items:center; justify-content:center;
  gap:.75rem; padding:4rem 1rem; color:var(--t2);
}
.spin {
  width:22px; height:22px; border-radius:50%;
  border:2.5px solid var(--b1); border-top-color:var(--aefe-blue);
  animation:spin .7s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
#toast {
  position:fixed; bottom:1.75rem; right:1.75rem; z-index:999;
  display:none; max-width:310px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(24px) saturate(200%);
  -webkit-backdrop-filter:blur(24px) saturate(200%);
  border:1px solid rgba(255,255,255,.7);
  border-radius:var(--r-lg); padding:.7rem 1rem;
  font-size:.82rem; color:var(--t0);
  box-shadow:0 4px 16px rgba(0,30,80,.08), 0 12px 40px rgba(0,53,163,.06),
             inset 0 1px 0 rgba(255,255,255,.8);
  animation:toastIn .3s var(--ease);
}
@keyframes toastIn { from { transform:translateY(12px); opacity:0; } to { transform:translateY(0); opacity:1; } }

/* ═══════════════════════════════════════
   CONFIRM
═══════════════════════════════════════ */
#confirm-ov {
  position:fixed; inset:0; z-index:300;
  background:rgba(0,20,50,.25); backdrop-filter:blur(12px) saturate(150%);
  -webkit-backdrop-filter:blur(12px) saturate(150%);
  display:none; align-items:center; justify-content:center;
}
#confirm-box {
  background:rgba(255,255,255,.8);

#confirm-box h3 { font-family:'Spectral',Georgia,serif; font-size:1.1rem; font-weight:700; color:var(--t0); margin-bottom:.5rem; }

.confirm-btns { display:flex; gap:.65rem; }
.confirm-btns button { flex:1; padding:.55rem; border-radius:var(--r-md); border:none; cursor:pointer; font-weight:700; font-size:.85rem; transition:all var(--dur) var(--ease); }
#cyes { background:#ef4444; color:#fff; }

footer {

}
.pe-label-icon { font-size:1rem; }

/* SWOT */
.swot-grid {

}
.swot-card {

}

}

/* Axes détaillés (objectifs / actions / indicateurs) */

  border-radius:var(--r-xl); padding:1.6rem 1.5rem; margin-bottom:1.1rem;
}
.axe-d1 { background:rgba(0,83,163,.1);   border:1px solid rgba(0,83,163,.25); }
.axe-d2 { background:rgba(34,197,94,.07); border:1px solid rgba(34,197,94,.2); }

.axe-num-badge {

.axe-detail-title {

  font-size:.98rem; font-weight:700; color:var(--t0); line-height:1.3; padding-top:.1rem;
}
.axe-detail-grid {
  display:grid; grid-template-columns:repeat(3,1fr);
  gap:.7rem; margin-bottom:1rem;
}
.axe-col {
  background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.6);
  border-radius:var(--r-md); padding:.85rem 1rem;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.axe-col-hd {
  font-size:.68rem; font-weight:700; text-transform:uppercase;
  letter-spacing:.06em; color:var(--t2); margin-bottom:.55rem;
}
.axe-col ul { font-size:.79rem; color:var(--t1); padding-left:.9rem; line-height:1.8; margin:0; }

/* Hero labels institutionnels */
.hero-labels {
  display:flex; gap:.45rem; flex-wrap:wrap; justify-content:flex-start; margin-top:.9rem;
}
.hero-label-badge {
  font-size:.67rem; padding:.18rem .68rem; border-radius:999px;

}

/* Clubs & vie associative */

}

}
.club-desc { font-size:.79rem; color:var(--t2); line-height:1.6; margin-bottom:.45rem; }

/* ═══════════════════════════════════════

═══════════════════════════════════════ */

/* Vérifie si l'utilisateur connecté est listé dans Enseignant_Referent */
function isReferent(p){
  if(!S.user||!p.Enseignant_Referent) return false;
  const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();
  const ref=norm(p.Enseignant_Referent);
  const nom=norm(S.user.nom);
  if(!nom||nom.length<2) return false;
  const nomMatch=ref.includes(nom)||nom.split(/[-\s]/).filter(x=>x.length>=3).some(x=>ref.includes(x));
  if(!nomMatch) return false;
  const prenom=norm(S.user.prenom);
  return !prenom||prenom.length<2||ref.includes(prenom);
}
function canEdit(p){ return S.user && (S.user.role==='admin'||S.user.role==='direction'||(S.user.role==='vie_scolaire'&&VS_CATS.includes(p.Categorie))||S.user.email===p.Created_By||isReferent(p)); }

let _busy=false;
function setBusy(btn){
  if(_busy) return false;
  _busy=true;
  if(btn&&btn instanceof HTMLElement){ btn.disabled=true; btn._wasBusy=true; }
  return true;
}
function clearBusy(){
  _busy=false;
  document.querySelectorAll('[disabled]').forEach(el=>{ if(el._wasBusy){ el.disabled=false; delete el._wasBusy; }});
}

/* Device info — RGPD : timezone uniquement, pas de geolocalisation IP */
function _devInfo(){
  const ua=navigator.userAgent;
  let os='Inconnu',nav='Inconnu',app='PC';
  if(ua.includes('Windows'))os='Windows'; else if(ua.includes('Mac OS'))os='macOS';
  else if(ua.includes('CrOS'))os='ChromeOS'; else if(ua.includes('Linux'))os='Linux';
  else if(ua.includes('Android')){os='Android';app='Mobile';} else if(ua.includes('iPhone')){os='iOS';app='Mobile';}
  else if(ua.includes('iPad')){os='iPadOS';app='Tablette';}
  if(ua.includes('Firefox/'))nav='Firefox'; else if(ua.includes('Edg/'))nav='Edge';
  else if(ua.includes('Chrome/')&&!ua.includes('Edg/'))nav='Chrome';
  else if(ua.includes('Safari/')&&!ua.includes('Chrome'))nav='Safari';
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
  const tzMap={'Indian/Antananarivo':['Madagascar','Antananarivo'],'Europe/Paris':['France','Paris'],
    'Indian/Reunion':['La Réunion','Saint-Denis'],'Indian/Mayotte':['Mayotte','Mamoudzou'],
    'Indian/Comoro':['Comores','Moroni'],'Africa/Nairobi':['Kenya','Nairobi'],
    'Asia/Ho_Chi_Minh':['Vietnam','Ho Chi Minh'],'America/New_York':['États-Unis','New York']};
  const loc=tzMap[tz]||[tz.split('/')[0]||'',tz.split('/')[1]||''];
  return {d_pays:loc[0],d_ville:loc[1],d_os:os,d_nav:nav,d_app:app};
}
function _auth(){ return {token: localStorage.getItem('lft_t')||''}; }
async function apiGet(p){ const r=await fetch(API_URL+'?'+new URLSearchParams({...p,..._devInfo()})); return r.json(); }
async function apiPost(p,b){ const r=await fetch(API_URL+'?'+new URLSearchParams({...p,..._auth(),..._devInfo()}),{method:'POST',redirect:'follow',body:JSON.stringify(b||{}),headers:{'Content-Type':'text/plain;charset=utf-8'}}); return r.json(); }

function computeStatus(p){
  const now=new Date(); now.setHours(0,0,0,0);
  const d=p.Date_Debut?new Date(p.Date_Debut):null;
  const f=p.Date_Fin?new Date(p.Date_Fin):null;
  if(!d&&!f) return 'Planifie';
  if(d&&now<d) return 'Planifie';
  if(f&&now>f) return 'Termine';
  if(d&&now>=d) return 'En cours';
  return 'Planifie';
}

let _skipPush=false; // flag pour éviter pushState lors du popstate
function navPush(){
  if(_skipPush) return;
  const state={page:S.page, filter:S.filter, selId:S.sel?S.sel.ID_Projet:null};
  const hash=S.page==='dashboard'?'':
    S.page==='detail'&&S.sel?'#/detail/'+encodeURIComponent(S.sel.ID_Projet):
    S.page==='category'?'#/cat/'+encodeURIComponent(S.filter):
    S.page==='filtered'?'#/filter/'+(S.filter||'all'):
    '#/'+S.page;
  history.pushState(state,'',(hash||window.location.pathname));
}
window.addEventListener('popstate',function(e){
  _skipPush=true;
  if(e.state){
    const st=e.state;
    S.page=st.page||'dashboard'; S.filter=st.filter||null; S.search=''; S.statusFilter='all';
    if(st.page==='detail'&&st.selId){
      const p=S.projects.find(x=>x.ID_Projet===st.selId);
      if(p){ S.sel=p; setBc([{l:p.Categorie,fn:`goCategory('${p.Categorie}')`},{l:p.Nom_Projet}]); renderDetail(p); }
      else showDashboard();
    } else if(st.page==='category'&&st.filter){
      setBc([{l:st.filter}]); renderCatPage(st.filter);
    } else if(st.page==='filtered'){
      const labels={null:'Tous les projets','Planifie':'Projets Planifiés','En cours':'Projets En cours','Termine':'Projets Terminés'};
      setBc([{l:labels[st.filter]||'Projets'}]); renderFilteredPage(st.filter);
    } else if(st.page==='dashboard'){
      setBc([]); renderDashboard();
    } else {
      const lbls={chronologie:'Chronologie',etab:"Projet d'Établissement",clubs:'Clubs & Activités',
        internat:"Projets de l'Internat",admin:'Administration',tutoriel:'Tutoriels',mentions:'Mentions légales'};
      setBc([{l:lbls[st.page]||st.page}]);
      const mc=document.getElementById('mc');
      switch(st.page){
        case 'chronologie': renderChronologie(mc); break;
        case 'etab': renderEtab(mc); break;
        case 'clubs': renderClubs(mc); break;
        case 'internat': renderInternat(mc); break;
        case 'admin': renderAdmin(mc); break;
        case 'tutoriel': renderTutoriel(mc); break;
        case 'mentions': renderMentions(mc); break;
        default: showDashboard();
      }
    }
  } else {
    showDashboard();
  }
  _skipPush=false;
});

async function doForceChange(){
  const btn=event&&event.target;
  if(!setBusy(btn)) return;
  const pw=v('cp-pw'), p2=v('cp-p2');
  const err=document.getElementById('ae'), ok=document.getElementById('ao');
  err.style.display='none'; ok.style.display='none';
  if(!pw||!p2){ err.textContent='Tous les champs sont obligatoires.'; err.style.display='block'; clearBusy(); return; }
  if(pw.length<8){ err.textContent='Minimum 8 caractères.'; err.style.display='block'; clearBusy(); return; }
  if(!/[A-Z]/.test(pw)||!/[a-z]/.test(pw)||!/[0-9]/.test(pw)){ err.textContent='Le mot de passe doit contenir au moins 1 majuscule, 1 minuscule et 1 chiffre.'; err.style.display='block'; clearBusy(); return; }
  if(pw!==p2){ err.textContent='Les mots de passe ne correspondent pas.'; err.style.display='block'; clearBusy(); return; }
  try {
    const oldToken=S._fcToken||'';
    const r=await fetch(API_URL+'?'+new URLSearchParams({action:'change-password',token:oldToken,..._devInfo()}),{method:'POST',redirect:'follow',body:JSON.stringify({new_password:pw}),headers:{'Content-Type':'text/plain;charset=utf-8'}});
    const d=await r.json();
    if(d.success){
      S.user=d.user||S._fcUser; S.user.first_login=false;
      saveSession(S.user, d.token);
      localStorage.setItem('lft_e',S._fcEmail);
      closeAuth(); updateHeader(); toast('Mot de passe modifié — bienvenue '+(S.user.prenom||'')+'!','🔐'); renderCurrent();
    } else { err.textContent=d.error||'Erreur.'; err.style.display='block'; }
  } catch(e){ err.textContent='Erreur réseau.'; err.style.display='block'; }
  finally { clearBusy(); }
}

async function doConfirmReset(token){
  const btn=event&&event.target;
  if(!setBusy(btn)) return;
  const pw=v('f-pw'), p2=v('f-p2');
  const err=document.getElementById('ae'), ok=document.getElementById('ao');
  err.style.display='none'; ok.style.display='none';
  if(!pw||!p2){ err.textContent='Tous les champs sont obligatoires.'; err.style.display='block'; clearBusy(); return; }
  if(pw.length<8){ err.textContent='Minimum 8 caractères.'; err.style.display='block'; clearBusy(); return; }
  if(!/[A-Z]/.test(pw)||!/[a-z]/.test(pw)||!/[0-9]/.test(pw)){ err.textContent='Le mot de passe doit contenir 1 majuscule, 1 minuscule et 1 chiffre.'; err.style.display='block'; clearBusy(); return; }
  if(pw!==p2){ err.textContent='Les mots de passe ne correspondent pas.'; err.style.display='block'; clearBusy(); return; }
  try {
    const d=await apiPost({action:'confirm-reset'},{token,password:pw});
    if(d.success){ ok.textContent=d.message||'Mot de passe modifié !'; ok.style.display='block'; setTimeout(openLogin,2200); }
    else { err.textContent=d.error||'Token invalide ou expiré.'; err.style.display='block'; }
  } catch(e){ err.textContent='Erreur réseau.'; err.style.display='block'; }
  finally { clearBusy(); }
}

function renderCatPage(cat){

  mc.innerHTML=`

}

function getSF(base){
  let list=base||[];
  if(S.statusFilter!=='all') list=list.filter(p=>computeStatus(p)===S.statusFilter);
  if(S.search){ const q=S.search.toLowerCase(); list=list.filter(p=>(p.Nom_Projet||'').toLowerCase().includes(q)||(p.Description||'').toLowerCase().includes(q)||(p.Enseignant_Referent||'').toLowerCase().includes(q)); }
  return list;
}

function setSF(f){
  S.statusFilter=f;
  if(S.page==='category') renderCatPage(S.filter);
  else if(S.page==='filtered') renderFilteredPage(S.filter);
}

function renderGrid(container){
  if(!container) return;
  const base=S.page==='category'? S.projects.filter(p=>p.Categorie===S.filter) : S.projects;
  const list=getSF(base);
  if(!list.length){ container.innerHTML=`<div class="empty"><span class="empty-icon">📭</span><p>Aucun projet trouvé</p></div>`; return; }
  container.innerHTML=list.map(p=>cardHTML(p)).join('');
}

/* ── Comments ── */
async function loadComments(id){
  try {
    const d=await apiGet({action:'list-comments',id});
    const el=document.getElementById('comments-list');
    if(!el) return;
    if(d.success && d.data && d.data.length){
      el.innerHTML=d.data.map(c=>`
        <div class="comment-item">
          <div class="comment-header"><strong>${esc(c.Author||c.Email||'')}</strong><span class="comment-date">${c.Date||''}</span></div>
          <div class="comment-body">${esc(c.Comment||c.Text||'')}</div>
        </div>`).join('');
    } else {
      el.innerHTML='<p class="comment-empty">Aucun commentaire pour le moment.</p>';
    }
  } catch(e){ const el=document.getElementById('comments-list'); if(el) el.innerHTML='<p class="comment-empty">Impossible de charger les commentaires.</p>'; }
}

async function submitComment(id){
  const btn=event&&event.target;
  if(!setBusy(btn)) return;
  const txt=document.getElementById('comment-text');
  if(!txt||!txt.value.trim()){ toast('Veuillez saisir un commentaire.','⚠️'); clearBusy(); return; }
  try {
    const d=await apiPost({action:'add-comment'},{id,comment:txt.value.trim()});
    if(d.success){ txt.value=''; toast('Commentaire ajouté.','💬'); loadComments(id); }
    else toast(d.error||'Erreur.','❌');
  } catch(e){ toast('Erreur réseau.','❌'); }
  finally { clearBusy(); }
}

function fmt(d){
  if(!d) return '?';
  try {
    const clean=String(d).trim().split(' ')[0]; // "2026-04-02 15:05:33" → "2026-04-02"
    const [y,m,day]=clean.split('-');
    const mo=['jan.','fév.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
    const di=parseInt(day,10), mi=parseInt(m,10);
    if(isNaN(di)||isNaN(mi)) return d;
    return `${di} ${mo[mi-1]} ${y}`;
  } catch(e){ return d; }
}

function nivToggleAll(cb){
  const checked=cb.checked;
  document.querySelectorAll('.niv-cb').forEach(c=>c.checked=checked);
  nivUpdate();
}
function nivUpdate(){
  const cbs=document.querySelectorAll('.niv-cb');
  const sel=[]; cbs.forEach(c=>{ if(c.checked) sel.push(c.value); });
  const allCb=document.getElementById('niv-all');
  allCb.checked=sel.length===cbs.length;
  const txt=document.getElementById('f-niv-text');
  const hidden=document.getElementById('f-niv');
  if(allCb.checked){
    txt.textContent='Tous niveaux';
    txt.classList.remove('placeholder');
    hidden.value='Tous niveaux';
  } else if(sel.length===0){
    txt.textContent='Sélectionner les niveaux...';
    txt.classList.add('placeholder');
    hidden.value='';
  } else if(sel.length<=3){
    txt.textContent=sel.join(', ');
    txt.classList.remove('placeholder');
    hidden.value=sel.join(', ');
  } else {
    txt.textContent=sel.length+' niveaux sélectionnés';
    txt.classList.remove('placeholder');
    hidden.value=sel.join(', ');
  }
}
function nivSetFromString(s){
  // Reset all checkboxes
  document.querySelectorAll('.niv-cb').forEach(c=>c.checked=false);
  document.getElementById('niv-all').checked=false;
  if(!s) { nivUpdate(); return; }
  const str=s.trim().toLowerCase();
  if(str==='tous niveaux' || str==='tous'){
    document.getElementById('niv-all').checked=true;
    document.querySelectorAll('.niv-cb').forEach(c=>c.checked=true);
    nivUpdate(); return;
  }
  // Alias map: normalized key → checkbox value
  const ALIAS={
    'cp':'CP','ce1':'CE1','ce2':'CE2','cm1':'CM1','cm2':'CM2',
    '6ème':'6ème','6eme':'6ème','sixième':'6ème','sixieme':'6ème','6e':'6ème',
    '5ème':'5ème','5eme':'5ème','cinquième':'5ème','cinquieme':'5ème','5e':'5ème',
    '4ème':'4ème','4eme':'4ème','quatrième':'4ème','quatrieme':'4ème','4e':'4ème',
    '3ème':'3ème','3eme':'3ème','troisième':'3ème','troisieme':'3ème','3e':'3ème',
    '2nde':'2nde','2de':'2nde','seconde':'2nde','seconde gt':'2nde',
    '2nde pro':'2nde Pro','seconde pro':'2nde Pro','seconde professionnelle':'2nde Pro',
    '1ère générale':'1ère Générale','1ere generale':'1ère Générale','1ère':'1ère Générale','1ere':'1ère Générale','première générale':'1ère Générale','premiere generale':'1ère Générale','première':'1ère Générale','premiere':'1ère Générale',
    '1ère stmg':'1ère STMG','1ere stmg':'1ère STMG','première stmg':'1ère STMG',
    '1ère pro':'1ère Pro','1ere pro':'1ère Pro','première pro':'1ère Pro','première professionnelle':'1ère Pro',
    'terminale générale':'Terminale Générale','terminale generale':'Terminale Générale','terminale':'Terminale Générale','tle générale':'Terminale Générale','tle generale':'Terminale Générale',
    'terminale stmg':'Terminale STMG','tle stmg':'Terminale STMG',
    'terminale pro':'Terminale Pro','tle pro':'Terminale Pro','terminale professionnelle':'Terminale Pro',
  };
  // Build reverse set of checkbox values
  const cbMap=new Map();
  document.querySelectorAll('.niv-cb').forEach(c=>cbMap.set(c.value,c));
  // Parse comma-separated values and match
  const parts=s.split(',').map(x=>x.trim()).filter(Boolean);
  parts.forEach(p=>{
    const pl=p.toLowerCase();
    // 1) Exact match on checkbox value
    const exactCb=cbMap.get(p) || cbMap.get(p.charAt(0).toUpperCase()+p.slice(1));
    if(exactCb){ exactCb.checked=true; return; }
    // 2) Alias lookup
    const mapped=ALIAS[pl];
    if(mapped && cbMap.has(mapped)){ cbMap.get(mapped).checked=true; return; }
    // 3) Try direct case-insensitive match
    cbMap.forEach((cb,val)=>{ if(val.toLowerCase()===pl) cb.checked=true; });
  });
  nivUpdate();
}

/* CHRONOLOGIE */
function renderChronologie(mc){
  mc.innerHTML=`
    <div class="sec-hd">
      <div class="sec-title">📅 Chronologie 2025–2026</div>
      <button class="btn btn-back" onclick="showDashboard()">← Accueil</button>
    </div>
    <div class="timeline" id="tl"></div>`;
  const tl=document.getElementById('tl');
  let html='';
  SCHOOL_MONTHS.forEach(sm=>{
    const items=S.projects.filter(p=>inMonth(p,sm));
    if(!items.length) return;
    html+=`<div class="tl-month" id="tl-${sm.k}"><div class="tl-month-hd">📆 ${sm.l} <small style="font-weight:400;color:var(--t3)">(${items.length})</small></div>`;
    items.forEach(p=>{
      const ph=getPhase(p,sm);
      const cls='phase-'+ph.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace('é','e');
      html+=`<div class="tl-item ${cls}" onclick="goDetail('${esc(p.ID_Projet)}')">
        <div class="tl-top"><span class="tl-phase">${ph}</span><span class="tl-name">${esc(p.Nom_Projet||'')}</span></div>
        <div class="tl-sub">👤 ${esc(p.Enseignant_Referent||'N/A')} · ${esc(p.Categorie||'')}</div>
      </div>`;
    });
    html+='</div>';
  });
  tl.innerHTML=html||'<p style="color:var(--t3);font-size:.85rem">Aucune donnée de date disponible.</p>';
  // Auto-scroll vers le mois en cours
  const now=new Date(), curKey=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const curEl=document.getElementById('tl-'+curKey);
  if(curEl){ setTimeout(()=>curEl.scrollIntoView({behavior:'smooth',block:'start'}),200); }
}
function inMonth(p,sm){
  if(!p.Date_Debut&&!p.Date_Fin) return false;
  const [y,m]=sm.k.split('-').map(Number);
  const ms=new Date(y,m-1,1), me=new Date(y,m,0);
  const d=p.Date_Debut?new Date(p.Date_Debut):null;
  const f=p.Date_Fin?new Date(p.Date_Fin):null;
  const s=d||ms, e=f||me;
  return s<=me&&e>=ms;
}
function getPhase(p,sm){
  if(!p.Date_Debut) return 'Réalisation';
  const [y,m]=sm.k.split('-').map(Number);
  const d=new Date(p.Date_Debut);
  if(d.getFullYear()===y&&d.getMonth()===m-1) return 'Lancement';
  if(p.Date_Fin){ const f=new Date(p.Date_Fin); if(f.getFullYear()===y&&f.getMonth()===m-1) return 'Clôture'; }
  return 'Réalisation';
}

async function addUser(){
  const btn=event&&event.target;
  if(!setBusy(btn)) return;
  const pnEl=document.getElementById('nu-pn');
  const nmEl=document.getElementById('nu-nm');
  const emEl=document.getElementById('nu-em');
  const roEl=document.getElementById('nu-ro');
  if(!pnEl||!nmEl||!emEl||!roEl){ toast('Formulaire introuvable.','❌'); clearBusy(); return; }
  const pn=pnEl.value.trim();
  const nm=nmEl.value.trim().toUpperCase();
  const em=emEl.value.trim().toLowerCase();
  const ro=roEl.value||'enseignant';
  if(!pn||!nm||!em){ toast('Prénom, nom et email sont obligatoires.','⚠️'); clearBusy(); return; }
  if(!em.endsWith('@egd.mg')){ toast('Email @egd.mg requis.','⚠️'); clearBusy(); return; }
  try {
    const d=await apiPost({action:'add',table:'Utilisateurs'},{Email:em,Role:ro,Nom:nm,Prenom:pn});
    if(d.success){ pnEl.value=''; nmEl.value=''; emEl.value=''; renderAdmin(document.getElementById('mc')); toast('Utilisateur créé ! Mdp : '+esc(d.generated_password),'✅'); }
    else toast(d.error||'Erreur lors de la création.','❌');
  } finally { clearBusy(); }
}

function renderCurrent(){
  if(S.page==='dashboard') renderDashboard();
  else if(S.page==='category') renderCatPage(S.filter);

  else if(S.page==='detail'&&S.sel) renderDetail(S.sel);
  else showPage(S.page);
}

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
async function init(){
  loadSession(); updateHeader();
  document.getElementById('mc').innerHTML=`<div class="loader"><div class="spin"></div> Chargement des projets…</div>`;
  setBc([]);
  await loadProjects();
  await loadTrashCount();
  // Détecter un token de réinitialisation dans l'URL (?reset=TOKEN)
  const params=new URLSearchParams(window.location.search);
  const resetToken=params.get('reset');
  if(resetToken){
    window.history.replaceState({},document.title,window.location.pathname);
    openResetForm(resetToken);
  }
  // Routage initial : respecter le hash dans l'URL (liens partagés)
  const hash=window.location.hash;
  if(hash.startsWith('#/detail/')){
    const id=decodeURIComponent(hash.replace('#/detail/',''));
    const p=S.projects.find(x=>x.ID_Projet===id);
    if(p){ S.page='detail'; S.sel=p; setBc([{l:p.Categorie,fn:`goCategory('${p.Categorie}')`},{l:p.Nom_Projet}]); history.replaceState({page:'detail',filter:null,selId:id},'',hash); renderDetail(p); }
    else { history.replaceState({page:'dashboard',filter:null,selId:null},'',window.location.pathname); renderDashboard(); }
  } else if(hash.startsWith('#/cat/')){
    const cat=decodeURIComponent(hash.replace('#/cat/',''));
    S.page='category'; S.filter=cat; setBc([{l:cat}]); history.replaceState({page:'category',filter:cat,selId:null},'',hash); renderCatPage(cat);
  } else if(hash.startsWith('#/filter/')){
    const f=decodeURIComponent(hash.replace('#/filter/',''));
    const fv=f==='all'?null:f; S.page='filtered'; S.filter=fv;
    const labels={null:'Tous les projets','Planifie':'Projets Planifiés','En cours':'Projets En cours','Termine':'Projets Terminés'};
    setBc([{l:labels[fv]||'Projets'}]); history.replaceState({page:'filtered',filter:fv,selId:null},'',hash); renderFilteredPage(fv);
  } else {
    history.replaceState({page:'dashboard',filter:null,selId:null},'',window.location.pathname); renderDashboard();
  }
}
init();
</script>
