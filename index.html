function errCnx(m){ const e=$('c-err'); e.textContent=m; e.classList.add('vue'); }
async function apresConnexion(d,msg){ garderSession(d); fermerFenetre(); viderListes(); toast(msg); await Promise.all([chargerAnnees(),actualiser(true)]); }
function seConnecter(btn){
  const em=val('c-em').toLowerCase(), pw=($('c-pw')||{}).value||'';
  if(!em||!pw) return errCnx('Indiquez votre adresse et votre mot de passe.');
  occupe(btn,async()=>{
    try{ const d=await api('auth/connexion',{methode:'POST',corps:{email:em,motDePasse:pw}}); await apresConnexion(d,'Bienvenue '+(d.prenom||'')+'.'); }
    catch(e){ errCnx(msgErr(e)); }
  });
}
function demanderLien(btn){
  const em=val('l-em').toLowerCase();
  if(!em) return errCnx('Indiquez votre adresse.');
  if(!/@egd\.mg$/.test(em)) return errCnx('Seules les adresses @egd.mg sont acceptées.');
  occupe(btn,async()=>{
    try{ const d=await api('auth/lien',{methode:'POST',corps:{email:em}}); $('c-err').classList.remove('vue'); $('l-ok-msg').innerHTML=`<div class="succes">${esc(d.message||'Si un compte existe pour cette adresse, un lien vient de lui être envoyé.')}</div>`; }
    catch(e){ errCnx(msgErr(e)); }
  });
}
/* Le jeton lu dans l'adresse reste en mémoire : il n'est jamais réinjecté dans la page. */
function ouvrirNouveauMdp(jeton){
  S._jeton=jeton;
  ouvrirFenetre(`<h2 id="fen-titre">Choisir votre mot de passe</h2><p>${REGLE_MDP}</p>
    <label class="champ"><span>Nouveau mot de passe</span><span class="mdp"><input class="saisie" type="password" id="n-pw" autocomplete="new-password"><button type="button" onclick="voirMdp(this)">Voir</button></span></label>
    <label class="champ"><span>Confirmer</span><span class="mdp"><input class="saisie" type="password" id="n-p2" autocomplete="new-password" onkeydown="if(event.key==='Enter')enregistrerMdp($('n-ok'))"><button type="button" onclick="voirMdp(this)">Voir</button></span></label>
    <div class="erreur" id="c-err" role="alert"></div>
    <button class="btn btn-bleu" id="n-ok" style="height:52px;font-size:16px" onclick="enregistrerMdp(this)">Enregistrer et me connecter</button>`,false,true);
}
function enregistrerMdp(btn){
  const pw=$('n-pw').value, p2=$('n-p2').value;
  if(pw.length<12) return errCnx('12 caractères au moins.');
  if(pw!==p2) return errCnx('Les deux saisies ne correspondent pas.');
  occupe(btn,async()=>{
    try{ const d=await api('auth/mot-de-passe',{methode:'POST',corps:{jeton:S._jeton||'',nouveau:pw}}); S._jeton=null; await apresConnexion(d,'Mot de passe enregistré : bienvenue '+(d.prenom||'')+'.'); }
    catch(e){ errCnx(msgErr(e)); }
  });
}
async function seDeconnecter(){
  try{ await api('auth/deconnexion',{methode:'POST'}); }catch(e){}
  oublierSession(); viderListes(); S.catsAutorisees=[]; S.corbeille=[];
  toast('Vous êtes déconnecté.'); await chargerAnnees();
  if(!S.years.includes(S.year)) S.year=S.currentYear;
  location.hash='#/'; majAdresse(); await actualiser(true);
}
function demanderSuppression(){
  confirmer('Supprimer mon compte',"Votre demande est transmise à l'administrateur, qui supprimera votre compte. Les projets que vous avez saisis sont conservés.",async()=>{
    try{ const d=await api('auth/demande-suppression',{methode:'POST'}); toast(d.message||'Demande transmise.'); }catch(e){ toast(msgErr(e)); }
  },{ok:'Envoyer la demande'});
}
/* ── Couverture : nombre de projets par parcours (et axe) et par niveau ── */
function compte(pa,axe,niv){
  return S.projets.filter(p=>{ const a=(p.parcours||{})[pa]; if(!a||!a.length) return false; if(axe!=null&&!a.includes(axe)) return false; return niveauxDe(p.niveaux).includes(niv); }).length;
}
function caseCouverture(n,P){
  if(!n) return '<td class="vide-case">à couvrir</td>';
  const fort=n>=3, moyen=n===2;
  return `<td style="font-weight:700;color:${fort?'#fff':P.fg};background:${fort?P.fg:P.bg};${moyen?`box-shadow:inset 0 0 0 2px ${P.fg}`:''}">${pluriel(n,'projet')}</td>`;
}

/* ── 5. Tableau de bord ── */
function vueTableau(mc){
  const ps=S.projets, n=ps.length;
  const st=Object.fromEntries(Object.keys(ST).map(k=>[k,ps.filter(p=>p.statut===k).length]));
  const avecPa=ps.filter(p=>nbParcours(p)>0).length;
  const maxCat=Math.max(1,...Object.keys(CAT).map(k=>ps.filter(p=>p.categorie===k).length));
  const trous=[];
  Object.keys(PA).forEach(k=>NIVEAUX.forEach(nv=>{ if(!compte(k,null,nv)) trous.push([k,nv]); }));
  const constat = !avecPa ? "Aucun projet n'indique encore de parcours éducatif. Le tableau se remplit à mesure que les fiches sont complétées."
    : trous.length ? `À retenir : ${pluriel(trous.length,'case reste','cases restent')} à couvrir. ${(()=>{ const k=Object.keys(PA).map(k=>[k,trous.filter(t=>t[0]===k).length]).sort((a,b)=>b[1]-a[1])[0]; return k[1]?`Le ${PA[k[0]].nom.toLowerCase()} est le moins couvert (${pluriel(k[1],'niveau')} sans projet).`:''; })()}`
    : 'Chaque niveau bénéficie d’au moins un projet dans chacun des quatre parcours.';
  mc.innerHTML=`<div style="display:flex;flex-direction:column;gap:24px">
    <div class="tete-page"><div><span class="surtitre">Année scolaire ${esc(S.year)}</span><h1 class="titre">Vue d'<em>ensemble</em></h1><p class="chapo">Les chiffres se calculent à partir des projets saisis.</p></div></div>
    <div class="kpis">
      <div class="carte kpi"><span>Projets</span><strong>${n}</strong><small>${ps.filter(p=>p.phare).length} phare(s)</small></div>
      <div class="carte kpi"><span>En cours</span><strong>${st.en_cours}</strong><small>${st.planifie} planifié(s), ${st.termine} terminé(s)</small></div>
      <div class="carte kpi"><span>Rattachés à un parcours</span><strong>${n?Math.round(avecPa*100/n):0} %</strong><small>${avecPa} sur ${n}</small></div>
      <div class="carte kpi"><span>Niveaux couverts</span><strong>${NIVEAUX.filter(nv=>Object.keys(PA).some(k=>compte(k,null,nv))).length} / ${NIVEAUX.length}</strong><small>au moins un parcours</small></div>
    </div>
    <div class="deux-col">
      <section class="carte bloc princ"><h2>Projets par catégorie</h2>
        ${Object.keys(CAT).map(k=>{ const c=ps.filter(p=>p.categorie===k).length; return `<div class="barre-cat"><span>${esc(CAT[k].l)}</span><span class="rail"><i style="width:${c*100/maxCat}%;background:${CAT[k].fg}"></i></span><strong>${c}</strong></div>`; }).join('')}
      </section>
      <section class="carte bloc cote"><h2>Avancement</h2>
        <div class="empile" role="img" aria-label="${Object.keys(ST).map(k=>ST[k].pl+' : '+st[k]).join(', ')}">${Object.keys(ST).map(k=>st[k]?`<span style="width:${st[k]*100/Math.max(1,n)}%;background:${ST[k].dot}"></span>`:'').join('')}</div>
        <div class="legende">${Object.keys(ST).map(k=>`<span><i style="background:${ST[k].dot}"></i>${ST[k].pl} : <strong>${st[k]}</strong></span>`).join('')}</div>
        <p class="txt" style="font-size:13px">Les projets terminés restent consultables et peuvent être reconduits l'année suivante.</p>
      </section>
    </div>
    <section class="carte bloc"><div style="display:flex;flex-direction:column;gap:6px"><span class="surtitre">Palier 1</span><h2>Couverture des parcours par niveau</h2><p class="txt" style="color:var(--gris)">Nombre de projets qui contribuent à chaque parcours. Les cases vides signalent un niveau à couvrir.</p></div>
      <div class="defile"><table class="matrice"><thead><tr><th scope="col" style="text-align:left">Parcours</th>${NIVEAUX.map(v=>`<th scope="col">${v}</th>`).join('')}</tr></thead>
        <tbody>${Object.keys(PA).map(k=>`<tr class="cliquable" onclick="S.paChoisi='${k}';location.hash='#/parcours'"><th scope="row" style="color:${PA[k].fg}">${PA_ONGLET[k]}</th>${NIVEAUX.map(v=>caseCouverture(compte(k,null,v),PA[k])).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="constat">${esc(constat)}</p>
    </section>
  </div>`;
}

/* ── 6. Parcours ── */
function vueParcoursPublic(mc){
  const k=S.paChoisi||'S', P=PA[k], passee=S.year<S.currentYear;
  const ps=S.projets.filter(p=>(p.parcours||{})[k]);
  const parAxe=P.axes.map((a,i)=>ps.filter(p=>(p.parcours[k]||[]).includes(i)).length);
  mc.innerHTML=`<div style="display:flex;flex-direction:column;gap:24px">
    <div class="tete-page"><div><span class="surtitre">Année scolaire ${esc(S.year)}</span><h1 class="titre">Les parcours <em>éducatifs</em></h1><p class="chapo">De la 6e à la terminale, quatre parcours définis par l'Éducation nationale accompagnent chaque élève. Voici les projets du lycée qui les ${passee?'ont fait vivre en '+esc(S.year):'font vivre cette année'}.</p></div></div>
    <div class="onglets" role="tablist" aria-label="Parcours">${Object.keys(PA).map(x=>`<button type="button" role="tab" aria-selected="${x===k}" style="${x===k?`border-color:${PA[x].fg};background:${PA[x].bg}`:''}" onclick="S.paChoisi='${x}';vueParcours($('mc'))"><strong>${PA_ONGLET[x]}</strong><span>${esc(PA[x].texte)}</span></button>`).join('')}</div>
    <section class="carte bloc"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline"><h2 style="color:${P.fg}">${esc(P.nom)}</h2><span class="aide">${esc(P.ref)}</span></div>
      <div class="axes3">${P.axes.map((a,i)=>`<div style="background:${P.bg}"><strong>${esc(a[0])}</strong><span>${esc(a[1])}</span>${parAxe[i]?`<small style="color:${P.fg}">${pluriel(parAxe[i],'projet')}</small>`:''}</div>`).join('')}</div></section>
    <section class="vitrine-section"><div class="tete-section"><span class="surtitre">${esc(PA_ONGLET[k])}</span><h2 class="titre-section">Les projets qui y <em>contribuent</em></h2></div>
      ${ps.length?`<div class="grille">${ps.map(carteProjet).join('')}</div>`:`<div class="carte vide">Aucun projet n'est encore rattaché à ce parcours pour ${esc(S.year)}.</div>`}
    </section>
  </div>`;
}
function vueParcours(mc){
  if(!S.user) return vueParcoursPublic(mc);
  const k=S.paChoisi||'S', P=PA[k], niv=S.nivChoisi||'6e';
  const ligne=(nv)=>`<tr class="cliquable${nv===niv?' choisi':''}" onclick="S.nivChoisi='${nv}';vueParcours($('mc'))"><th scope="row">${nv}</th>${P.axes.map((ax,i)=>caseCouverture(compte(k,i,nv),P)).join('')}</tr>`;
  const manques=P.axes.map((ax,i)=>[ax[0],NIVEAUX.filter(nv=>!compte(k,i,nv))]);
  const vides=manques.filter(m=>m[1].length===NIVEAUX.length).map(m=>'« '+m[0]+' »');
  const casesVides=manques.reduce((s,m)=>s+m[1].length,0);
  const constat = vides.length ? `À retenir : aucun projet ne travaille ${vides.join(' ni ')}. C'est le manque à combler en priorité.`
    : casesVides ? `À retenir : ${pluriel(casesVides,'case reste','cases restent')} à prévoir, notamment ${manques.find(m=>m[1].length)[0].toLowerCase()} en ${manques.find(m=>m[1].length)[1].join(', ')}.`
    : `Chaque niveau travaille les trois axes du ${P.nom.toLowerCase()}.`;
  const projets=S.projets.filter(p=>(p.parcours||{})[k]&&niveauxDe(p.niveaux).includes(niv));
  mc.innerHTML=`<div style="display:flex;flex-direction:column;gap:24px">
    <div class="tete-page"><div><span class="surtitre">Paliers 1 et 2 : les niveaux</span><h1 class="titre">Les parcours des <em>élèves</em></h1><p class="chapo">Ce que les projets du lycée apportent à chaque parcours, niveau par niveau. Aucune donnée individuelle d'élève : tout se déduit des projets saisis.</p></div></div>
    <div class="onglets" role="tablist" aria-label="Parcours">${Object.keys(PA).map(x=>`<button type="button" role="tab" aria-selected="${x===k}" style="${x===k?`border-color:${PA[x].fg};background:${PA[x].bg}`:''}" onclick="S.paChoisi='${x}';vueParcours($('mc'))"><strong>${PA_ONGLET[x]}</strong><span>${esc(PA[x].texte)}</span></button>`).join('')}</div>
    <section class="carte bloc"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline"><h2 style="color:${P.fg}">${esc(P.nom)}</h2><span class="aide">${esc(P.ref)}</span></div>
      <div class="axes3">${P.axes.map(a=>`<div style="background:${P.bg}"><strong>${esc(a[0])}</strong><span>${esc(a[1])}</span></div>`).join('')}</div></section>
    <div class="deux-col"><div class="princ">
      <section class="carte bloc"><div style="display:flex;flex-direction:column;gap:6px"><span class="surtitre">Couverture par niveau et par axe</span><h2>${esc(PA_ONGLET[k])} : les niveaux du collège et du lycée</h2><span class="aide">Cliquez sur un niveau pour voir les projets qui y contribuent.</span></div>
        <div class="defile"><table class="matrice"><thead><tr><th scope="col" style="text-align:left">Niveau</th>${P.axes.map(a=>`<th scope="col">${esc(a[0])}</th>`).join('')}</tr></thead><tbody>${NIVEAUX.map(ligne).join('')}</tbody></table></div>
        <p class="constat">${esc(constat)}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-clair" onclick="window.print()">Imprimer pour le conseil pédagogique</button>${peutCreer()?`<a class="btn btn-accent" href="#/nouveau">${IC.plus}Proposer un projet pour combler un manque</a>`:''}</div>
      </section>
      <section class="carte bloc"><h2>Projets qui y contribuent en ${niv}</h2>
        ${projets.length?projets.map(p=>`<a class="rangee" href="#/projet/${encodeURIComponent(p.code)}" style="text-decoration:none;color:inherit"><span><strong>${esc(p.nom)}</strong><small>${esc(p.niveaux||'')}</small></span><span class="gestes">${p.parcours[k].map(i=>`<span class="pa" style="color:${P.fg};background:${P.bg}">${esc(P.axes[i][0])}</span>`).join('')}</span></a>`).join('')
          :`<p class="txt">Aucun projet pour l'instant. C'est un manque à signaler en conseil pédagogique.</p>`}
      </section>
    </div>
    <aside class="cote">
      <div class="palier"><strong><b>1</b>La couverture</strong><span>Par niveau, pour toute l'équipe : c'est l'écran ci-contre et le tableau de bord.</span><a href="#/tableau">Ouvrir le tableau de bord</a></div>
      <div class="palier"><strong><b>2</b>Le carnet de classe</strong><span>Par classe, pour les conseils de classe et l'homologation. Il s'ouvrira quand les classes concernées seront indiquées sur les fiches ; en attendant, la couverture se lit par niveau.</span></div>
      <div class="palier ferme"><strong><b>3</b>Le carnet de l'élève</strong><span>${IC.cadenas.replace('<svg','<svg width="16" height="16" style="vertical-align:-3px;margin-right:4px"')}Verrouillé. Il ne s'ouvrira qu'après l'analyse d'impact, l'avis du délégué à la protection des données et la décision de la direction.</span></div>
    </aside></div>
  </div>`;
}

/* ── 7. Pilotage de la direction ── */
function vueDirection(mc){
  if(!estDirection()){ mc.innerHTML='<div class="carte vide">Réservé à la direction et à l\'administrateur de l\'application.</div>'; return; }
  const ps=S.projets, phares=ps.filter(p=>p.phare).length;
  const candidats=ps.filter(p=>p.phare||p.phare_propose).concat(ps.filter(p=>!p.phare&&!p.phare_propose));
  const incompletes=ps.map(p=>{ const m=[]; if(!nbParcours(p)) m.push('aucun parcours'); if(!p.description) m.push('pas de résumé'); if(!p.date_debut&&!p.date_fin) m.push('pas de dates'); if(!p.niveaux) m.push('pas de niveau'); return [p,m]; }).filter(x=>x[1].length);
  const verrouilles=ps.filter(p=>p.verrouille).length, ecr=peutEcrireAnnee();
  const suiv=anneeSuivante(S.currentYear), ouverte=S.years.includes(suiv);
  mc.innerHTML=`<div style="display:flex;flex-direction:column;gap:24px">
    <div class="tete-page"><div><span class="surtitre">Réservé à la direction</span><h1 class="titre">Pilotage de l'<em>année</em></h1><p class="chapo">Choisir les projets mis en avant, relancer les fiches incomplètes, clore l'année et préparer la suivante.</p></div></div>
    <div class="deux-col"><div class="princ">
      <section class="carte bloc"><div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap"><h2>Projets phares</h2><span class="pastille" style="color:var(--or-texte);background:#FFF1D6">${phares} sur ${PHARES_MAX}</span></div>
        <p class="txt" style="color:var(--gris)">Les équipes proposent ; la direction retient. Les projets retenus portent le marqueur dans la liste et apparaissent en premier, y compris sur la présentation publique.</p>
        <div id="dir-phares">${candidats.slice(0,12).map(p=>`<div class="rangee"><span><strong>${esc(p.nom)}</strong><small>${esc(CAT[p.categorie]?CAT[p.categorie].l:p.categorie)}${p.phare_propose&&!p.phare?', proposé par l\'équipe':''}${p.phare?', retenu':''}</small></span><span class="gestes">${ecr?`<button class="btn ${p.phare?'btn-clair':'btn-bleu'} btn-petit" ${!p.phare&&phares>=PHARES_MAX?'disabled title="Trois projets phares au plus"':''} onclick="basculerPhare('${jsq(p.code)}',this)">${p.phare?'Retirer':'Retenir'}</button>`:''}</span></div>`).join('')||'<p class="txt">Aucun projet cette année.</p>'}</div>
        ${candidats.length>12?`<p class="aide">Les autres projets se marquent depuis leur fiche.</p>`:''}
      </section>
      <section class="carte bloc"><h2>Fiches à compléter <span class="aide">(${incompletes.length})</span></h2>
        ${incompletes.slice(0,15).map(([p,m])=>`<div class="rangee"><span><strong>${esc(p.nom)}</strong><small>${esc(m.join(', '))}${p.referents?' : '+esc(p.referents):''}</small></span><span class="gestes"><a class="btn btn-clair btn-petit" href="#/projet/${encodeURIComponent(p.code)}">Ouvrir la fiche</a></span></div>`).join('')||'<p class="txt">Toutes les fiches sont complètes.</p>'}
        ${incompletes.length>15?`<p class="aide">Et ${incompletes.length-15} autre(s).</p>`:''}
      </section>
    </div>
    <aside class="cote">
      <section class="carte bloc"><span class="surtitre">Année consultée</span><strong style="font-family:var(--serif);font-size:28px">${esc(S.year)}</strong>
        <p class="txt" style="font-size:14px">${pluriel(verrouilles,'fiche verrouillée','fiches verrouillées')} sur ${ps.length}. Une fiche verrouillée ne se modifie plus que par la direction.</p>
        ${ecr&&ps.length?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-bleu btn-petit" onclick="verrouillerTout(this,true)">Tout verrouiller</button><button class="btn btn-clair btn-petit" onclick="verrouillerTout(this,false)">Tout déverrouiller</button></div>`:''}
      </section>
      <section class="carte bloc"><span class="surtitre">Préparer la rentrée</span><strong style="font-size:17px">${ouverte?'Année '+esc(suiv)+' ouverte':'Ouvrir l\'année '+esc(suiv)}</strong>
        <p class="txt" style="font-size:14px">${ouverte?'Les collègues voient les deux années et peuvent reconduire leurs projets.':`Choisissez les projets de ${esc(S.currentYear)} à reconduire : l'année ${esc(suiv)} s'ouvre avec eux. ${esc(S.currentYear)} reste consultable.`}</p>
        ${S.year===S.currentYear?`<button class="btn btn-accent btn-petit" onclick="ouvrirLot()">Reconduire des projets vers ${esc(suiv)}</button>`:(estArchive()?`<button class="btn btn-accent btn-petit" onclick="ouvrirLot()">Reprendre des projets en ${esc(S.currentYear)}</button>`:'')}
      </section>
      <section class="carte bloc"><span class="surtitre">Outils</span>
        <a class="rangee" href="#/corbeille" style="text-decoration:none;color:inherit"><span><strong>Corbeille</strong><small>${pluriel(S.corbeille.length,'projet')} en ${esc(S.year)}</small></span></a>
        <a class="rangee" href="#/comptes" style="text-decoration:none;color:inherit"><span><strong>Comptes et journal</strong><small>Qui se connecte, qui ajoute ou supprime, d'où</small></span></a>
        <button class="rangee" style="border-left:0;border-right:0;border-bottom:0;background:none;cursor:pointer;text-align:left;width:100%;font:inherit" onclick="exporter()"><span><strong>Exporter ${esc(S.year)}</strong><small>Tableur, toutes les colonnes</small></span></button>
      </section>
    </aside></div></div>`;
}
async function verrouillerTout(btn,verrouiller){
  const cibles=S.projets.filter(p=>!!p.verrouille!==verrouiller);
  if(!cibles.length){ toast('Rien à changer.'); return; }
  confirmer(verrouiller?'Tout verrouiller':'Tout déverrouiller',`${pluriel(cibles.length,'fiche')} de ${S.year} ${verrouiller?'ne se modifieront plus que par la direction':'redeviennent modifiables par leurs équipes'}.`,async()=>{
    let ok=0;
    for(const p of cibles){ try{ await api('projets/verrou',{methode:'POST',corps:{id:p.id,verrouiller}}); ok++; }catch(e){} }
    toast(`${ok} sur ${cibles.length} fiche(s) ${verrouiller?'verrouillée(s)':'déverrouillée(s)'}.`); await actualiser(true);
  },{ok:verrouiller?'Verrouiller':'Déverrouiller'});
}
async function exporter(){
  try{
    toast('Export en cours…');
    const r=await fetch('/api/projets/export?'+new URLSearchParams({annee:S.year}),{credentials:'same-origin',cache:'no-store'});
    if(!r.ok){ let m='Export impossible.'; try{ m=(await r.json()).message||m; }catch(e){} toast(m); return; }
    const u=URL.createObjectURL(await r.blob()), a=document.createElement('a');
    a.href=u; a.download='projets-lft-'+S.year+'.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(u);
    toast('Export téléchargé.');
  }catch(e){ toast('Erreur réseau.'); }
}

let L=null;
async function ouvrirLot(){
  const source=S.year, cible=cibleReconduction();
  L={source,cible,items:[],choix:new Set(),filtre:''};
  ouvrirFenetre(`<h2 id="fen-titre">Reconduire vers ${esc(cible)}</h2><div class="chargement"><span class="rond-charge"></span> Lecture de ${esc(cible)}…</div>`,true);
  let deja=new Set();
  try{ const d=await api('projets/liste',{query:{annee:cible}}); (d.projets||[]).forEach(p=>{ if(p.reconduit_de) deja.add(p.reconduit_de.id); }); }catch(e){}
  L.items=S.projets.map(p=>({id:p.id,code:p.code,nom:p.nom,cat:p.categorie,ref:p.referents||'',deja:deja.has(p.id)}));
  dessinerLot();
}
function dessinerLot(){
  const items=L.items.filter(i=>!L.filtre||i.cat===L.filtre), rest=L.items.filter(i=>!i.deja).length;
  ouvrirFenetre(`<h2 id="fen-titre">Reconduire vers ${esc(L.cible)}</h2>
    <p>Les projets cochés sont recopiés dans <strong>${esc(L.cible)}</strong> : contenu et parcours repris, dates vidées, statut « Planifié ». Les fiches de ${esc(L.source)} ne changent pas.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <select class="sel-role" onchange="L.filtre=this.value;dessinerLot()"><option value="">Toutes les catégories</option>${Object.keys(CAT).map(k=>`<option value="${k}"${L.filtre===k?' selected':''}>${esc(CAT[k].l)}</option>`).join('')}</select>
      <button class="btn btn-clair btn-petit" onclick="toutCocher(true)">Tout cocher</button><button class="btn btn-clair btn-petit" onclick="toutCocher(false)">Tout décocher</button>
      <span class="aide" id="lot-n">${pluriel(L.choix.size,'projet choisi','projets choisis')}</span></div>
    <div class="lot">${items.map(i=>`<label class="${i.deja?'fait':''}"><input type="checkbox" ${i.deja?'disabled':''} ${L.choix.has(i.id)?'checked':''} onchange="cocherLot('${jsq(i.id)}',this.checked)"><span>${esc(i.nom)}<small>${esc(i.code)}${i.ref?', '+esc(i.ref):''}${i.deja?', déjà repris':''}</small></span></label>`).join('')||'<p style="padding:14px">Aucun projet.</p>'}</div>
    <div class="erreur" id="lot-err" role="alert"></div>
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span class="aide">${rest} reconductible(s) sur ${L.items.length}</span><span style="display:flex;gap:10px"><button class="btn btn-clair" onclick="fermerFenetre()">Annuler</button><button class="btn btn-accent" id="lot-go" onclick="lancerLot(this)">Reconduire la sélection</button></span></div>`,true);
}
function cocherLot(id,on){ on?L.choix.add(id):L.choix.delete(id); $('lot-n').textContent=pluriel(L.choix.size,'projet choisi','projets choisis'); }
function toutCocher(on){ L.items.filter(i=>!i.deja&&(!L.filtre||i.cat===L.filtre)).forEach(i=>on?L.choix.add(i.id):L.choix.delete(i.id)); dessinerLot(); }
function lancerLot(btn){
  const ids=[...L.choix];
  if(!ids.length){ const e=$('lot-err'); e.textContent='Cochez au moins un projet.'; e.classList.add('vue'); return; }
  occupe(btn,async()=>{
    btn.textContent='Reconduction en cours…';
    try{
      const d=await api('projets/reconduire',{methode:'POST',corps:{ids,annee_cible:L.cible}});
      if(!S.years.includes(d.annee)){ S.years.push(d.annee); S.years.sort(); }
      const c=d.crees||[], ig=d.ignores||[], er=d.erreurs||[];
      ouvrirFenetre(`<h2 id="fen-titre">Reconduction terminée</h2><p><strong>${pluriel(c.length,'projet créé','projets créés')}</strong> dans ${esc(d.annee)}.${ig.length?` ${ig.length} ignoré(s), déjà repris.`:''}${er.length?` ${er.length} en erreur.`:''}</p>
        ${er.length?`<ul>${er.slice(0,8).map(x=>`<li>${esc(x.code||x.nom||'?')} : ${esc(x.motif)}</li>`).join('')}</ul>`:''}
        <p>Les dates n'ont pas été reprises : à renseigner sur chaque nouvelle fiche.</p>
        <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><button class="btn btn-clair" onclick="fermerFenetre();dessinerEntete()">Rester sur ${esc(L.source)}</button><button class="btn btn-bleu" onclick="fermerFenetre();changerAnnee('${jsq(d.annee)}')">Voir ${esc(d.annee)}</button></div>`);
      toast(pluriel(c.length,'projet reconduit','projets reconduits')+' vers '+d.annee+'.');
    }catch(e){ const x=$('lot-err'); if(x){ x.textContent=msgErr(e); x.classList.add('vue'); } btn.textContent='Reconduire la sélection'; }
  });
}

async function basculerRepere(btn,a,k,id,m){
  const x=elevesDe(a,k).find(e=>e.id===id); if(!x) return;
  const corps={id};
  const bascule=(l)=>l.includes(m)?l.filter(v=>v!==m):l.concat([m]);
  if(ACCOMP.includes(m)) corps.accompagnements=bascule(x.accompagnements||[]); else corps.mandats=bascule(x.mandats);
  btn.disabled=true;
  try{ const d=await api('projets/eleves',{methode:'PATCH',corps}); x.mandats=d.eleve.mandats;
    if(d.eleve.accompagnements) x.accompagnements=d.eleve.accompagnements;
    btn.setAttribute('aria-pressed',ACCOMP.includes(m)?x.accompagnements.includes(m):x.mandats.includes(m)); }
  catch(e){ toast(msgErr(e)); }
  btn.disabled=false;
}

/* ═══════════════════════════════════════════════════════════
   DÉMARRAGE : ce qui est connu de l'appareil s'affiche aussitôt (dernière liste,
   années, personne connectée), puis le serveur est interrogé.
═══════════════════════════════════════════════════════════ */
async function demarrer(){
  chargerSession();
  const params=new URLSearchParams(location.search);
  const anneeDemandee=params.get('annee')||params.get('year');
  // Lien reçu par courriel : /#jeton=... (le # n'est jamais envoyé au serveur). Retiré aussitôt de l'adresse.
  const frag=location.hash.startsWith('#jeton=')?new URLSearchParams(location.hash.slice(1)):null;
  const jeton=(frag&&frag.get('jeton'))||params.get('jeton');
  appliquerAnnees(lireStock(CLE_ANNEES));
  S.year=anneeDemandee||S.currentYear;
  if(jeton) history.replaceState(null,'',location.pathname+(anneeDemandee?'?annee='+encodeURIComponent(anneeDemandee):'')+'#/');
  const c=lireStock(CLE_LISTE+S.year);
  if(c&&Array.isArray(c.projets)){ appliquerListe(c); S.charge=true; }
  rendre();
  if(jeton) ouvrirNouveauMdp(jeton);
  await Promise.all([chargerAnnees(),chargerProjets(),chargerMoi()]);
  if(anneeDemandee&&!S.years.includes(anneeDemandee)){ S.year=S.currentYear; majAdresse(); await chargerProjets(); }
  await chargerCorbeille();
  rendre();
}
demarrer();

</script>
